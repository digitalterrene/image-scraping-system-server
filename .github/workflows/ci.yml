name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-hygiene:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit and API test suite
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js for repository hygiene audit
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Senior Repo Standards hygiene audit
        run: node .agents/skills/senior-repo-standards/scripts/audit-hygiene.js
